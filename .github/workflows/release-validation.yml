name: Validate final 0.9.0 candidate

on:
  workflow_dispatch:
    inputs:
      app_candidate_sha:
        description: Exact untagged application candidate commit to validate
        required: true
        type: string
      build_run_id:
        description: Custom MOTIS build run containing the selected candidate artifact
        required: true
        type: string
      pbf_url:
        description: Immutable South Korea PBF URL used by the final validation
        required: true
        type: string
      pbf_sha256:
        description: SHA-256 of the exact PBF at pbf_url
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
    env:
      TARGET_SHA: ${{ inputs.app_candidate_sha }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      PBF_URL: ${{ inputs.pbf_url }}
      PBF_SHA256: ${{ inputs.pbf_sha256 }}
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.app_candidate_sha }}
          fetch-depth: 0

      - name: Confirm the checkout is immutable
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:TARGET_SHA) { throw "Candidate checkout differs: expected $env:TARGET_SHA, got $actual" }
          if ($env:TRANSIT_MOTIS_DIST_DIR) { throw 'TRANSIT_MOTIS_DIST_DIR overrides are forbidden in final validation.' }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download the selected Custom MOTIS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: motis-windows-x64-v2.11.3-osr32-${{ inputs.build_run_id }}
          path: candidate-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}

      - name: Expand and verify the selected Custom MOTIS artifact
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath .\candidate-artifact\motis-windows-x64-v2.11.3-osr32.zip -DestinationPath .\candidate-dist -Force
          node .\scripts\motis\verify-patched-build.mjs .\candidate-dist\motis-manifest.json --mode candidate

      - name: Download and verify the exact PBF
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\data\osm | Out-Null
          Invoke-WebRequest -Uri $env:PBF_URL -OutFile .\data\osm\south-korea-latest.osm.pbf
          $actual = (Get-FileHash .\data\osm\south-korea-latest.osm.pbf -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:PBF_SHA256.ToLowerInvariant()) { throw "PBF hash differs: expected $env:PBF_SHA256, got $actual" }

      - name: Build and smoke-test the packaged application
        shell: pwsh
        env:
          TRANSIT_MOTIS_DIST_DIR: ${{ github.workspace }}\candidate-dist
        run: |
          npm run package:win
          npm run test:packaged-smoke
          $smoke = Get-ChildItem .\test-artifacts\packaged-smoke -Recurse -Filter result.json | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $smoke) { throw 'Packaged smoke result.json was not produced.' }
          New-Item -ItemType Directory -Force -Path .\validation | Out-Null
          Copy-Item $smoke.FullName .\validation\packaged-smoke-result.json

      - name: Run the exact coordinate scenario against the candidate binary
        shell: pwsh
        env:
          MOTIS_EXECUTABLE_PATH: ${{ github.workspace }}\candidate-dist\motis.exe
        run: |
          npm run test:motis-scenario -- --full-osm --origin-lat 34.7437 --origin-lng 127.7348 --destination-lat 34.7616 --destination-lng 127.6680
          $scenario = Get-ChildItem .\test-artifacts\motis-scenario -Recurse -Filter report.json | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $scenario) { throw 'Coordinate scenario report.json was not produced.' }
          Copy-Item $scenario.FullName .\validation\scenario-report.json

      - name: Collect 32-way actual-data and boundary evidence
        shell: pwsh
        run: |
          npm run motis:validate-release-candidate -- `
            --archive .\candidate-artifact\motis-windows-x64-v2.11.3-osr32.zip `
            --pbf .\data\osm\south-korea-latest.osm.pbf `
            --build-run-id $env:BUILD_RUN_ID `
            --scenario-report .\validation\scenario-report.json `
            --output .\test-artifacts\motis-validation-attestation.json

      - name: Verify deployable Custom MOTIS component artifact
        shell: pwsh
        run: |
          node .\scripts\release\verify-custom-motis-artifact.mjs `
            --archive .\candidate-artifact\motis-windows-x64-v2.11.3-osr32.zip `
            --distribution .\candidate-dist `
            --packaged-binary .\release\win-unpacked\resources\motis\motis.exe `
            --output .\test-artifacts\motis-component-artifact.json

      - name: Run app regression and typecheck gates
        shell: pwsh
        run: |
          npm run test
          npm run typecheck

      - name: Collect product readiness evidence
        shell: pwsh
        run: |
          $smoke = Get-ChildItem .\test-artifacts\packaged-smoke -Recurse -Filter result.json | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $smoke) { throw 'Packaged smoke result.json was not produced.' }
          New-Item -ItemType Directory -Force -Path .\docs\test-reports | Out-Null
          npm run release:collect-product -- `
            --app-version 0.9.0 `
            --attestation .\test-artifacts\motis-validation-attestation.json `
            --artifact .\test-artifacts\motis-component-artifact.json `
            --smoke-result $smoke.FullName `
            --output .\docs\test-reports\0.9.0-final-readiness.json

      - name: Upload immutable validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-readiness-evidence-${{ inputs.app_candidate_sha }}
          path: |
            docs/test-reports/0.9.0-final-readiness.json
            test-artifacts/motis-validation-attestation.json
            test-artifacts/motis-component-artifact.json
            test-artifacts/packaged-smoke
          if-no-files-found: error
          retention-days: 90
