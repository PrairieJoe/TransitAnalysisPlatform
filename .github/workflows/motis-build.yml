name: Build Custom MOTIS candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Activate MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install deterministic packaging dependencies
        run: npm ci --ignore-scripts

      - name: Verify Ninja availability
        shell: pwsh
        run: ninja --version

      - name: Build pinned Custom MOTIS candidate
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\motis\build-patched-windows-msvc.ps1

      - name: Verify Custom MOTIS candidate
        shell: pwsh
        run: node .\scripts\motis\verify-patched-build.mjs .\vendor\motis\patched-windows\motis-manifest.json --mode candidate

      - name: Package candidate artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\candidate-artifact | Out-Null
          node .\scripts\motis\package-deterministic-candidate.mjs `
            .\vendor\motis\patched-windows `
            .\candidate-artifact\motis-windows-x64-v2.11.3-osr32.zip `
            --metadata .\candidate-artifact\candidate-metadata.json
          $metadata = Get-Content -Raw .\candidate-artifact\candidate-metadata.json | ConvertFrom-Json
          "$($metadata.archiveSha256) *motis-windows-x64-v2.11.3-osr32.zip" | `
            Set-Content -Encoding ascii .\candidate-artifact\motis-windows-x64-v2.11.3-osr32.sha256
          Copy-Item .\vendor\motis\patched-windows\motis-manifest.json .\candidate-artifact\motis-manifest.json
          Copy-Item .\vendor\motis\patched-windows\builder-observation.json .\candidate-artifact\builder-observation.json

      - name: Upload candidate artifact
        id: candidate-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motis-windows-x64-v2.11.3-osr32-${{ github.run_id }}
          path: candidate-artifact
          if-no-files-found: error
          retention-days: 30

      - name: Attest the deterministic candidate archive
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: .\candidate-artifact\motis-windows-x64-v2.11.3-osr32.zip
          show-summary: true

      - name: Create external build proof envelope
        shell: pwsh
        env:
          MOTIS_WORKFLOW_PATH: .github/workflows/motis-build.yml
          MOTIS_ARTIFACT_ID: ${{ steps.candidate-upload.outputs.artifact-id }}
          MOTIS_ARTIFACT_NAME: motis-windows-x64-v2.11.3-osr32-${{ github.run_id }}
          MOTIS_ARTIFACT_DIGEST: ${{ steps.candidate-upload.outputs.artifact-digest }}
        run: |
          $workflowSha = git rev-parse "HEAD:.github/workflows/motis-build.yml"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($workflowSha)) { throw 'Unable to resolve workflow blob SHA.' }
          $env:MOTIS_WORKFLOW_SHA = $workflowSha.Trim()
          node .\scripts\motis\create-build-proof-envelope.mjs `
            --lock .\scripts\motis\motis-builder-lock.json `
            --observation .\candidate-artifact\builder-observation.json `
            --candidate-metadata .\candidate-artifact\candidate-metadata.json `
            --output .\motis-build-proof.json

      # The pending envelope is intentionally ineligible for lock promotion.
      # A controlled follow-up must verify GitHub's artifact attestation and
      # replace artifactAttestation with the verified receipt before promotion.
      - name: Upload external build proof envelope
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motis-build-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: motis-build-proof.json
          if-no-files-found: error
          retention-days: 30
