name: Publish validated Custom MOTIS

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Build-only workflow run ID whose candidate artifact was validated
        required: true
        type: string
      build_run_attempt:
        description: Build workflow run attempt used for the immutable proof artifact
        required: true
        default: '1'
        type: string
      validation_run_id:
        description: Workflow run ID containing the exact validation attestation artifact
        required: true
        type: string
      validation_artifact_name:
        description: Artifact name containing motis-validation-attestation.json
        required: true
        default: motis-validation-attestation
        type: string
      component_tag:
        description: Existing immutable Custom MOTIS component tag
        required: true
        default: motis-v2.11.3-osr32.1
        type: string

permissions:
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.component_tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
      VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
      ARTIFACT_NAME: motis-windows-x64-v2.11.3-osr32-${{ inputs.build_run_id }}
      ARCHIVE_NAME: motis-windows-x64-v2.11.3-osr32.zip
      CHECKSUM_NAME: motis-windows-x64-v2.11.3-osr32.sha256
    steps:
      - name: Check out locked release metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Download the exact build-run artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: candidate-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}

      - name: Download the external build proof envelope
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: motis-build-proof-${{ inputs.build_run_id }}-${{ inputs.build_run_attempt }}
          path: build-proof
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}

      - name: Download the exact validation attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.validation_artifact_name }}
          path: validation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.validation_run_id }}

      - name: Verify lock, archive, manifest, binary, and motis-validation attestation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^motis-v2\.11\.3-osr32\.[1-9][0-9]*$ ]] || { echo 'Only a canonical Custom MOTIS component tag is allowed.' >&2; exit 1; }
          [[ "$RELEASE_TAG" != 'v0.7.0' ]] || { echo 'The app stable tag cannot be published by the component workflow.' >&2; exit 1; }
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null
          test -f "candidate-artifact/${ARCHIVE_NAME}"
          test -f "candidate-artifact/${CHECKSUM_NAME}"
          test -f "candidate-artifact/motis-manifest.json"
          test -f "candidate-artifact/builder-observation.json"
          test -f "build-proof/motis-build-proof.json"
          test -f "validation/motis-validation-attestation.json"
          (cd candidate-artifact && sha256sum -c "${CHECKSUM_NAME}")
          npm run motis:verify-builder-lock
          node scripts/motis/verify-patched-build.mjs candidate-artifact/motis-manifest.json
          node --input-type=module -e "import fs from 'node:fs'; import { validateBuildProofEnvelope } from './scripts/motis/build-proof.mjs'; import { verifyReleaseAttestation } from './scripts/motis/builder-lock.mjs'; const proof=JSON.parse(fs.readFileSync('build-proof/motis-build-proof.json','utf8')); validateBuildProofEnvelope(proof); if(proof.provenance.runId !== process.env.BUILD_RUN_ID) throw new Error('Proof run differs from requested artifact run'); if(proof.provenance.runAttempt !== Number(process.env.BUILD_RUN_ATTEMPT)) throw new Error('Proof attempt differs from requested artifact attempt'); const lock=JSON.parse(fs.readFileSync('scripts/motis/motis-builder-lock.json','utf8')); const attestation=JSON.parse(fs.readFileSync('validation/motis-validation-attestation.json','utf8')); verifyReleaseAttestation(lock, attestation); if(attestation.buildRunId !== proof.provenance.runId) throw new Error('Attestation build run differs from proof'); if(attestation.archiveSha256 !== fs.readFileSync('candidate-artifact/'+process.env.CHECKSUM_NAME,'utf8').trim().split(/\s+/)[0]) throw new Error('Attestation archive SHA-256 differs from artifact');"
          rm -rf candidate-artifact/extracted
          mkdir candidate-artifact/extracted
          unzip -q "candidate-artifact/${ARCHIVE_NAME}" -d candidate-artifact/extracted
          MANIFEST_PATH=$(find candidate-artifact/extracted -name motis-manifest.json -type f -print -quit)
          test -n "$MANIFEST_PATH"
          node scripts/motis/verify-patched-build.mjs "$MANIFEST_PATH"

      - name: Publish the already-verified artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Transit Analysis Platform $RELEASE_TAG" \
            --generate-notes \
            "candidate-artifact/${ARCHIVE_NAME}" \
            "candidate-artifact/${CHECKSUM_NAME}" \
            "candidate-artifact/motis-manifest.json" \
            "validation/motis-validation-attestation.json"
